<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<script>
/* 다시 온 사람은 랜딩을 보지 않는다. 화면이 그려지기 전에 넘겨야 깜빡이지 않으므로
   <head> 맨 위에서 판단한다.
   location.replace 를 쓰는 이유: 히스토리에 남지 않아야 리포트에서 뒤로 가기를 눌렀을 때
   랜딩 → 리포트 → 랜딩 … 루프에 빠지지 않는다.
   localStorage 가 막혀 있어도(사생활 보호 모드 등) 랜딩은 떠야 하므로 통째로 try 로 감싼다. */
(function () {
  try {
    var q = new URLSearchParams(location.search);
    if (q.get('home') === '1') return;              // 일부러 랜딩을 보려는 경우
    var code = q.get('code') || localStorage.getItem('ssn_last_symbol');
    if (!code) return;                              // 진짜 첫 방문 → 랜딩
    var h = q.get('h');
    location.replace('./report.html?code=' + encodeURIComponent(code)
      + (h ? '&h=' + encodeURIComponent(h) : ''));
  } catch (e) { /* 랜딩을 보여주면 된다 */ }
})();
</script>
<title>주가 리포트 — 앞으로 얼마나 흔들릴까요</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#2563eb">
<link rel="icon" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<style>
  body{font-family:'Pretendard','Malgun Gothic','Apple SD Gothic Neo',sans-serif;background:#f4f6fb;color:#1c2333;margin:0;padding:40px 16px}
  main{max-width:520px;margin:0 auto}
  h1{font-size:1.6rem}
  a{display:block;padding:16px;margin:10px 0;background:#fff;border:1px solid #e2e7f2;border-radius:14px;
    color:#1c2333;text-decoration:none;font-weight:700}
</style>
</head>
<body>
  <main>
    <h1>주가 리포트</h1>
    <p>종목을 고르면 리포트로 갑니다.</p>
    <div id="symList">
      <a href="./report.html?code=005930">삼성전자</a>
      <a href="./report.html?code=000660">SK하이닉스</a>
    </div>
  </main>
</body>
</html>
