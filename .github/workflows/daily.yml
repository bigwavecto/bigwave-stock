name: 일일 데이터 갱신

on:
  schedule:
    # 평일 07:40 UTC = 한국시간 16:40 (장 마감 15:30 이후)
    - cron: '40 7 * * 1-5'
  workflow_dispatch: {}   # Actions 탭에서 수동 실행 버튼 활성화

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 시세 수집 및 예측 계산
        run: node scripts/update_daily.js

      - name: 변경사항 커밋
        run: |
          git config user.name "auto-update-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "데이터 자동 갱신 $(date -u +'%Y-%m-%d')"
            git push
          fi
